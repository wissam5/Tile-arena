      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: tile-arena
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: cp tile-arena/app/build/outputs/apk/debug/app-debug.apk TileArena.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileArena-apk
          path: TileArena.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-build-${{ github.run_number }}
          name: Tile Arena build ${{ github.run_number }}
          files: TileArena.apk
